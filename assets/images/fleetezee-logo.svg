    <path d="M12 18H25C27.2091 18 29 19.7909 29 22C29 24.2091 27.2091 26 25 26H16V18Z" fill="#3AA68C" opacity="0.9" />
    <!-- Active pulse node -->
    <circle cx="34" cy="8" r="3" fill="#3696D2" />
    <circle cx="34" cy="8" r="6" stroke="#3696D2" stroke-width="1.5" stroke-opacity="0.4" />
  </g>
  <!-- Wordmark -->
  <text x="50" y="27" fill="#F7F7F4" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="0.22em">FLEETEZEE</text>
  <text x="52" y="38" fill="#8B949E" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.8" font-weight="600" letter-spacing="0.32em">TRANSPORTATION TECHNOLOGY</text>
</svg>
