<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 44" fill="none" class="fleetezee-brand-logo">
  <!-- Dynamic Kinetic Node Monogram (F + Connected Corridor) -->
  <g class="logo-mark" transform="translate(2, 4)">
    <defs>
      <linearGradient id="fzLinearGlow" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#3AA68C" />
        <stop offset="100%" stop-color="#3696D2" />
      </linearGradient>
      <linearGradient id="fzCoreGlow" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#D6DFE8" />
      </linearGradient>
    </defs>
    <!-- Geometric backbone bar -->
    <path d="M4 36L4 2C4 0.89543 4.89543 0 6 0H14C15.1046 0 16 0.89543 16 2V36C16 37.1046 15.1046 38 14 38H6C4.89543 38 4 37.1046 4 36Z" fill="url(#fzCoreGlow)" />
    <!-- Dynamic forward kinetic flow vectors (Upper bar) -->
    <path d="M12 2H28C31.3137 2 34 4.68629 34 8C34 11.3137 31.3137 14 28 14H16V2Z" fill="url(#fzLinearGlow)" />
